name: docker

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t kubsu-app ./docker


  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t kubsu-app ./docker

      - name: Start postgres
        run: |
          docker run -d --name postgres \
            -e POSTGRES_DB=kubsu \
            -e POSTGRES_USER=kubsu \
            -e POSTGRES_PASSWORD=kubsu \
            -p 5432:5432 \
            postgres:15

      - name: Wait DB
        run: sleep 5

      - name: Run tests
        run: |
          docker run --rm \
            --network host \
            -e DATABASE_URL=postgresql+psycopg://kubsu:kubsu@127.0.0.1:5432/kubsu \
            kubsu-app \
            pytest


  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 212.192.134.135
          username: linnaeus
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull kubsu-app || true
            docker stop kubsu || true
            docker rm kubsu || true
            docker run -d --name kubsu -p 60080:8000 kubsu-app


  verify:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Check service
        run: curl http://212.192.134.135:60080/linnaeus/users/
